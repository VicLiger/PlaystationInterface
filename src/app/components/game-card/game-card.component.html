<div class="container-game-legend"
    (mouseleave)="onMouseLeave()"   
    >
    <div class="card-image"
     (mouseenter)="onMouseEnter()"
     [ngStyle]="{ 
       transform: gameFooter ? 'scale(1.25)' : 'scale(1)', 
       boxShadow: gameFooter ? '0 0 3.5px 2px rgba(0, 0, 255, 0.7)' : 'none' 
            }">
            <img [src]="imagePath" alt="Game Card">
            <div class="start-game">Iniciar</div>
    </div>

    <div class="game-options"  
    [ngStyle]="{ transform: gameFooter ? 'scale(1.25)' : 'scale(1)', opacity: gameFooter ? '1' : '0' }">

      <button class="button-options" [attr.disabled]="!gameFooter ? true : null" 
              [ngClass]="{'disabled-button': !gameFooter}">
          Visão geral
      </button>
      <button class="button-options" [attr.disabled]="!gameFooter ? true : null" 
              [ngClass]="{'disabled-button': !gameFooter}">
          Atividades recentes
      </button>
      <button class="button-options" [attr.disabled]="!gameFooter ? true : null" 
              [ngClass]="{'disabled-button': !gameFooter}">
          Itens relacionados
      </button>

  </div>
</div>
